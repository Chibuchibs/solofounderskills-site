<svg viewBox="0 0 520 380" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="A founder at a laptop with ideas forming above them">
  <defs>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb86b"/><stop offset="1" stop-color="#ff6b35"/>
    </linearGradient>
    <linearGradient id="cool" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4ecdc4"/><stop offset="1" stop-color="#1a9e94"/>
    </linearGradient>
  </defs>

  <!-- glow behind -->
  <ellipse cx="260" cy="210" rx="210" ry="150" fill="#ffe8d6" opacity=".55"/>

  <!-- floating idea cards -->
  <g opacity=".95">
    <rect x="52" y="44" width="104" height="66" rx="13" fill="#fff" stroke="#ffd4b8" stroke-width="2"/>
    <circle cx="78" cy="70" r="10" fill="url(#warm)"/>
    <rect x="95" y="64" width="46" height="6" rx="3" fill="#ffd4b8"/>
    <rect x="68" y="88" width="72" height="6" rx="3" fill="#f0e4da"/>

    <rect x="370" y="60" width="106" height="72" rx="13" fill="#fff" stroke="#c8 efe9" stroke-width="2"/>
    <rect x="370" y="60" width="106" height="72" rx="13" fill="#fff" stroke="#c9efea" stroke-width="2"/>
    <rect x="386" y="104" width="12" height="16" rx="3" fill="url(#cool)"/>
    <rect x="404" y="92" width="12" height="28" rx="3" fill="url(#cool)"/>
    <rect x="422" y="80" width="12" height="40" rx="3" fill="url(#cool)"/>
    <rect x="440" y="96" width="12" height="24" rx="3" fill="#bfeae5"/>

    <rect x="392" y="196" width="96" height="58" rx="13" fill="#fff" stroke="#ffd4b8" stroke-width="2"/>
    <path d="M409 232l14-16 12 11 16-19" stroke="url(#warm)" stroke-width="4"
          fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- sparkles -->
  <g fill="#ff6b35">
    <path d="M196 38l4 10 10 4-10 4-4 10-4-10-10-4 10-4z"/>
    <path d="M330 150l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" opacity=".7"/>
    <path d="M118 168l2.5 6 6 2.5-6 2.5-2.5 6-2.5-6-6-2.5 6-2.5z" opacity=".55"/>
  </g>

  <!-- desk -->
  <rect x="112" y="300" width="300" height="11" rx="5.5" fill="#e8d5c4"/>
  <rect x="150" y="311" width="12" height="42" rx="4" fill="#dcc6b2"/>
  <rect x="362" y="311" width="12" height="42" rx="4" fill="#dcc6b2"/>

  <!-- laptop -->
  <path d="M206 222h112a7 7 0 0 1 7 7v62H199v-62a7 7 0 0 1 7-7z" fill="#2d3142"/>
  <rect x="207" y="230" width="110" height="54" rx="4" fill="#4ecdc4" opacity=".28"/>
  <rect x="217" y="242" width="52" height="5" rx="2.5" fill="#fff" opacity=".85"/>
  <rect x="217" y="254" width="74" height="5" rx="2.5" fill="#fff" opacity=".6"/>
  <rect x="217" y="266" width="38" height="5" rx="2.5" fill="#ff6b35" opacity=".9"/>
  <path d="M186 291h152l8 9H178z" fill="#3d4257"/>

  <!-- person -->
  <g>
    <path d="M228 300c0-28 14-46 34-46s34 18 34 46z" fill="url(#cool)"/>
    <path d="M246 268c-16 6-24 18-26 32h18z" fill="#17867e" opacity=".5"/>
    <circle cx="262" cy="228" r="25" fill="#8d5a3b"/>
    <path d="M238 224c0-15 10-25 24-25s24 10 24 25c0 4-2 6-2 6s-4-12-22-12-22 12-22 12-2-2-2-6z" fill="#2d2118"/>
    <!-- hand to chin, thinking -->
    <path d="M276 262c7-2 12-8 12-15" stroke="#8d5a3b" stroke-width="11"
          fill="none" stroke-linecap="round"/>
    <circle cx="280" cy="246" r="7" fill="#8d5a3b"/>
  </g>

  <!-- thought dots rising -->
  <circle cx="300" cy="196" r="5" fill="#ff6b35" opacity=".5"/>
  <circle cx="312" cy="176" r="7" fill="#ff6b35" opacity=".35"/>
  <circle cx="326" cy="152" r="9" fill="#ff6b35" opacity=".22"/>
</svg>
